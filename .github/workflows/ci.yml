name: CI

on:
  push:
  pull_request:

jobs:
  dry-run:
    name: dry run on a sample project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: action
      - uses: java-package-manager/setup-jpm@v1
      - name: A project with a changeset
        run: |
          set -eux
          mkdir -p sample/src/app && cd sample
          printf '{\n  "name": "app",\n  "version": "1.0.0",\n  "extensions": { "github:java-package-manager/jpm-changeset": "^0.3.1" }\n}\n' > project.jsonc
          printf 'package app; public class A {}\n' > src/app/A.java
          printf '.cache/\ndist/\n' > .gitignore
          jpm install
          jpm changeset add --minor -m "Add a greeting."
          git init -q -b main
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm init
      - uses: ./action
        with:
          working-directory: sample
          dry-run: "true"
      - name: The version commit is on the release branch
        working-directory: sample
        run: |
          set -eux
          test "$(git branch --show-current)" = main
          test "$(git log -1 --format=%s changeset-release/main)" = "Version 1.1.0"
          git show changeset-release/main:project.jsonc | grep -q '"version": "1.1.0"'
          git show changeset-release/main:CHANGELOG.md | grep -q 'Add a greeting.'
          test -z "$(git ls-tree changeset-release/main .changeset/ | grep '\.md$' || true)"

  release-dry-run:
    name: release dry run on a sample project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: action
      - uses: java-package-manager/setup-jpm@v1
      - name: A project whose version has no tag yet, with only an empty changeset
        run: |
          set -eux
          mkdir -p sample/src/app && cd sample
          printf '{\n  "name": "app",\n  "group": "com.example",\n  "version": "1.1.0",\n  "extensions": { "github:java-package-manager/jpm-changeset": "^0.3.1" }\n}\n' > project.jsonc
          printf 'package app; public class A {}\n' > src/app/A.java
          printf '.cache/\ndist/\n' > .gitignore
          printf '# app\n\n## 1.1.0\n\n### Minor changes\n\n- Add a greeting.\n' > CHANGELOG.md
          jpm install
          jpm changeset add --empty -m "Only CI changed."
          git init -q -b main
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm init
      - uses: ./action
        id: release
        with:
          working-directory: sample
          dry-run: "true"
      - name: No version pull request for an empty changeset; without jpm publish, the version is only tagged, with its changelog entry
        working-directory: sample
        env:
          TAGS: ${{ steps.release.outputs.tags }}
          PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          set -eux
          test "$TAGS" = 1.1.0
          test "$PUBLISHED" = true
          test "$(git branch --show-current)" = main
          ! git rev-parse --verify --quiet changeset-release/main
          test -n "$(ls .changeset/*.md)"
          test -z "$(git status --porcelain)"
          test "$(git tag -l 1.1.0 --format='%(contents:subject)')" = "app 1.1.0"
          git tag -l 1.1.0 --format='%(contents:body)' | grep -q '^### Minor changes$'
          git tag -l 1.1.0 --format='%(contents:body)' | grep -q 'Add a greeting.'
          git tag -d 1.1.0
      - uses: ./action
        id: required
        continue-on-error: true
        with:
          working-directory: sample
          dry-run: "true"
          publish: "true"
      - name: publish true fails without jpm publish, and tags nothing
        working-directory: sample
        env:
          OUTCOME: ${{ steps.required.outcome }}
        run: |
          set -eux
          test "$OUTCOME" = failure
          test -z "$(git tag -l 1.1.0)"

  # A push to main whose VERSION has no tag yet is released, once every test passes: a tag v<version>
  # (v1.2.3), a GitHub release, and the major tag (v1) moved to it, so `changeset-action@v1` always gets the newest v1.x.y.
  release:
    name: release
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [dry-run, release-dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Release a new version
        run: |
          set -eu
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::VERSION must be a version such as 1.2.3, not \"$version\""
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
            exit 0
          fi
          pre=""
          case "$version" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" --title "changeset-action $tag" --generate-notes $pre
          echo "::notice::released $tag"
          # v1 follows the newest v1.x.y release (not pre-releases)
          if [ -z "$pre" ]; then
            major="v${version%%.*}"
            git tag -f "$major" "$GITHUB_SHA"
            git push -f origin "refs/tags/$major"
            echo "::notice::moved $major to $tag"
          fi
